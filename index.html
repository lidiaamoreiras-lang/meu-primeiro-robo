<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Python</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.05.1/pyscript.css" />
    <script defer src="https://pyscript.net/releases/2023.05.1/pyscript.js"></script>
    <style>
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial; }
        .calculadora { background: #ecf0f1; padding: 30px; border-radius: 20px; text-align: center; width: 320px; }
        input { width: 80px; padding: 10px; margin: 10px; border-radius: 8px; border: 1px solid #bdc3c7; text-align: center; }
        .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; cursor: pointer; border: none; border-radius: 8px; background-color: #27ae60; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div class="calculadora">
        <h1>🤖 Robô Calculador</h1>
        <input type="number" id="n1" placeholder="N1">
        <input type="number" id="n2" placeholder="N2">
        <div class="botoes">
            <button py-click="calcular('+')">Somar (+)</button>
            <button py-click="calcular('-')">Subtrair (-)</button>
            <button py-click="calcular('*')">Multiplicar (x)</button>
            <button py-click="calcular('/')">Dividir (÷)</button>
        </div>
        <h2 id="resultado">Resultado: ?</h2>
    </div>
    <py-script src="./calculadora.py"></py-script>
</body>
</html>
