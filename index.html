<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Super Robô Calculador</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #2c3e50; padding: 50px; color: white; }
        .caixa { background: #ecf0f1; padding: 30px; border-radius: 20px; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); display: inline-block; color: #333; }
        input { padding: 12px; margin: 10px; border-radius: 8px; border: 2px solid #bdc3c7; width: 100px; font-size: 16px; text-align: center; }
        button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background-color: #27ae60; color: white; transition: 0.3s; }
        button:hover { background-color: #219150; transform: scale(1.05); }
        #resultado { margin-top: 20px; font-size: 1.5em; color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>
    <div class="caixa">
        <h2>🤖 Meu Robô Calculador</h2>
        <input type="number" id="n1" placeholder="N1">
        <input type="number" id="n2" placeholder="N2">
        <br>
        <button onclick="somar()">Calcular Soma</button>
        <div id="resultado">Resultado: ?</div>
    </div>
    <script>
        function somar() {
            var num1 = Number(document.getElementById("n1").value);
            var num2 = Number(document.getElementById("n2").value);
            var soma = num1 + num2;
            document.getElementById("resultado").innerHTML = "A soma é: " + soma;
        }
    </script>
</body>
</html>
