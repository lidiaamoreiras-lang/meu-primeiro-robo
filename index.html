<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Robô</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .calculadora {
            background: #ecf0f1;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
        }
        input {
            width: 80px;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #bdc3c7;
            text-align: center;
            font-size: 18px;
        }
        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2ecc71;
            transform: scale(1.05);
        }
        h2 {
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <h1>🤖 Robô Calculador</h1>
        <input type="number" id="n1" placeholder="N1">
        <input type="number" id="n2" placeholder="N2">
        
        <div class="botoes">
            <button onclick="calcular('+')">Somar (+)</button>
            <button onclick="calcular('-')">Subtrair (-)</button>
            <button onclick="calcular('*')">Multiplicar (x)</button>
            <button onclick="calcular('/')">Dividir (÷)</button>
        </div>

        <h2 id="resultado">Resultado: ?</h2>
    </div>

    <section class="pyscript">
        <script type="py" src="./calculadora.py" config="./pyscript.json"></script>
    </section>

</body>
</html>
